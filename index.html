<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ComicCraft - AI Comic Story Creator</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💥</text></svg>">
</head>
<body class="scenic-body">

  <!-- Navigation -->
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <span>🎨</span> Comic<span class="highlight">Craft</span>
    </a>
    <div class="nav-links">
      <a href="/" class="nav-link">Home</a>
      <a href="/docs" target="_blank" class="nav-link">API Docs</a>
    </div>
  </nav>

  <!-- Main Content Wrapper -->
  <main class="container form-wrapper">
    <div class="card">
      <div class="card-header">
        <h1 class="card-title">🖌️ Create Your Comic</h1>
        <p class="card-subtitle">Generate a 5-panel story, dialogues, and illustrations with Gemini & Stable Diffusion</p>
      </div>

      <form id="comicForm" action="/generate" method="POST" class="comic-form">
        <!-- Story Prompt -->
        <div class="form-group">
          <label for="prompt" class="form-label">Story Prompt:</label>
          <textarea 
            id="prompt" 
            name="prompt" 
            class="form-control" 
            rows="3" 
            placeholder="A brave fox explores an enchanted forest." 
            required>A brave fox explores an enchanted forest.</textarea>
        </div>

        <!-- Main Character Name -->
        <div class="form-group">
          <label for="character_name" class="form-label">Main Character Name:</label>
          <input 
            type="text" 
            id="character_name" 
            name="character_name" 
            class="form-control" 
            placeholder="e.g., Free, Luna, Kaelen" 
            value="Free" 
            required>
        </div>

        <!-- Setting -->
        <div class="form-group">
          <label for="setting" class="form-label">Setting:</label>
          <select id="setting" name="setting" class="form-select">
            <option value="Forest" selected>Forest</option>
            <option value="School">School</option>
            <option value="Space">Space</option>
            <option value="Futuristic City">Futuristic City</option>
            <option value="Ancient Castle">Ancient Castle</option>
            <option value="Desert Oasis">Desert Oasis</option>
            <option value="Underwater Kingdom">Underwater Kingdom</option>
          </select>
        </div>

        <!-- Form Row: Tone and Art Style -->
        <div class="form-row">
          <div class="form-group">
            <label for="tone" class="form-label">Story Tone:</label>
            <select id="tone" name="tone" class="form-select">
              <option value="Dramatic" selected>Dramatic</option>
              <option value="Light-hearted">Light-hearted</option>
              <option value="Poetic">Poetic</option>
              <option value="Funny">Funny</option>
              <option value="Action-packed">Action-packed</option>
            </select>
          </div>

          <div class="form-group">
            <label for="style" class="form-label">Art Style:</label>
            <select id="style" name="style" class="form-select">
              <option value="Comic Book">Comic Book</option>
              <option value="Anime">Anime</option>
              <option value="Pixel Art">Pixel Art</option>
              <option value="Realistic" selected>Realistic</option>
              <option value="Vintage Pop-Art">Vintage Pop-Art</option>
            </select>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary btn-block">
          Generate Comic 🚀
        </button>
      </form>
    </div>
  </main>

  <!-- Interactive AI Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-title">Crafting Your Comic Story...</div>
    <div id="loadingStep" class="loading-step">Gemini Flash is preparing your 5-panel comic storyboard...</div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>ComicCraft © 2026 • Powered by Google Gemini AI & Stable Diffusion</p>
  </footer>

  <script src="/static/js/main.js"></script>
</body>
</html>
